<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Baseball Players Visualization</title>
  </head>
  <body class="bg-slate-100 text-slate-900">
    <div class="min-h-screen">
      <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur">
        <div class="mx-auto flex items-center justify-between py-3 px-5 gap-6">
          <div class="flex items-center gap-3 shrink-0">
            <div class="cursor-default">
              <p class="text-xs font-semibold uppercase tracking-[0.18em] text-teal-600" style="font-family: 'Space Grotesk', sans-serif;">MLB Dashboard</p>
              <h1 class="text-lg font-semibold leading-none" style="font-family: 'Space Grotesk', sans-serif;">Player Visualization</h1>
            </div>
          </div>
          
          <div class="flex-1 flex justify-center">
            <div class="relative w-full max-w-md">
              <div class="relative flex items-center">
                <input 
                  id="player-search"
                  type="text" 
                  placeholder="Search players..." 
                  class="w-full rounded-lg border border-slate-300 bg-slate-50 px-4 py-2 pl-10 text-sm focus:border-teal-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/20"
                />
                <svg class="absolute left-3 h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
              </div>

              <div id="player-suggestions" class="absolute left-0 right-0 top-full z-50 mt-2 hidden max-h-44 overflow-y-auto rounded-lg border border-slate-200 bg-white p-2 shadow-lg"></div>
            </div>
          </div>
          
          <div class="shrink-0">
          </div>
        </div>
      </header>

      <div class="flex w-full">
        <aside
          id="side-menu"
          class="border-r border-slate-200 bg-white px-5 py-6 static z-0 w-64 translate-x-0 shadow-none"
          aria-label="Sidebar menu"
        >
        <div class="flex justify-between">
          <button id="btn-batting" data-stat-button data-stat-type="batting" class="rounded-lg border border-slate-300 px-2.5 py-2 text-xs font-medium text-slate-700 hover:bg-slate-100 cursor-pointer disabled:cursor-not-allowed disabled:border-teal-500 disabled:bg-teal-50 disabled:text-teal-700 disabled:hover:bg-teal-50" disabled>Batting</button>
          <button id="btn-pitching" data-stat-button data-stat-type="pitching" class="rounded-lg border border-slate-300 px-3 py-2.5 text-xs font-medium text-slate-700 hover:bg-slate-100 cursor-pointer disabled:cursor-not-allowed disabled:border-teal-500 disabled:bg-teal-50 disabled:text-teal-700 disabled:hover:bg-teal-50">Pitching</button>
          <button id="btn-fielding" data-stat-button data-stat-type="fielding" class="rounded-lg border border-slate-300 px-2.5 py-2 text-xs font-medium text-slate-700 hover:bg-slate-100 cursor-pointer disabled:cursor-not-allowed disabled:border-teal-500 disabled:bg-teal-50 disabled:text-teal-700 disabled:hover:bg-teal-50">Fielding</button>
        </div>

        <div class="mt-6">
          <div class="mb-3 flex items-center gap-3">
            <span class="h-px flex-1 bg-slate-200"></span>
            <span class="text-[11px] font-semibold uppercase tracking-[0.12em] text-slate-500" style="font-family: 'Space Grotesk', sans-serif;">Players</span>
            <span class="h-px flex-1 bg-slate-200"></span>
          </div>

          <div id="selected-players-list" class="max-h-[calc(100vh-220px)] space-y-2 overflow-y-auto pr-1 cursor-default">
            <p class="text-xs text-slate-500">No players selected yet.</p>
          </div>
        </div>
        </aside>

        <main class="min-h-[calc(100vh-65px)] flex-1 py-6 lg:p-6">
          <div id="app" class="rounded-2xl border border-slate-200 bg-white p-6"></div>
          <div id="player-details" class="hidden fixed inset-0 bg-gray-800/70 items-center justify-center p-4 z-50">
            <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
              <div class="flex justify-between items-center mb-4">
                <div>
                  <h3 id="details-player-name" class="text-lg font-semibold"></h3>
                  <p id="details-category" class="text-sm text-slate-500"></p>
                </div>
                <button id="close-details" class="text-gray-500 hover:text-gray-800">&times;</button>
              </div>
              <div id="details-year-selector-container">
                <label for="details-year-select" class="block text-sm font-medium text-gray-700">Select Year</label>
                <select id="details-year-select" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md"></select>
              </div>
              <div id="details-stats-container" class="mt-4"></div>
            </div>
          </div>
        </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
